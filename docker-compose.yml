version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# MeshPilot — CPU-Only AI Inference Platform
# Single-node Docker Compose stack
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:

  # ── Reverse Proxy ───────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: meshpilot-nginx
    # Host 80/443 are already taken by the existing agenthinkmesh.com stack
    # (pitchproof-caddy-1). MeshPilot binds 8100 on the host instead; TLS and
    # the public hostname are handled by that existing Caddy — see
    # meshpilot-caddy.conf. Bind to 127.0.0.1 so 8100 is NOT reachable from the
    # public internet: the only way in is via the reverse proxy.
    # HTTPS is for serving employees directly. It also stays on this machine
    # until MESHPILOT_HTTPS_BIND=0.0.0.0 opens it to the network.
    ports:
      - "127.0.0.1:${MESHPILOT_PORT:-8100}:80"
      - "${MESHPILOT_HTTPS_BIND:-127.0.0.1}:${MESHPILOT_HTTPS_PORT:-8443}:443"
    environment:
      - MESHPILOT_HOSTNAMES=${MESHPILOT_HOSTNAMES:-localhost}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/meshpilot-locations.conf:/etc/nginx/meshpilot-locations.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meshpilot-api
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - REDIS_URL=redis://redis:6379/0
      - MODEL_STORAGE=/models
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:?Set AUDIT_HMAC_KEY in .env}
      - MESHPILOT_ENV=${MESHPILOT_ENV:-production}
      - DOCKER_PROXY_URL=http://docker-proxy:2375
      - LOCAL_DEFAULT_MODEL=${LOCAL_DEFAULT_MODEL:-benchmark-mistral-7b}
      - CLOUD_ROUTING_ENABLED=${CLOUD_ROUTING_ENABLED:-false}
      - CLOUD_API_BASE=${CLOUD_API_BASE:-}
      - CLOUD_API_KEY=${CLOUD_API_KEY:-}
      - CLOUD_MODEL=${CLOUD_MODEL:-}
      - CLOUD_MAX_TOKENS_PARAM=${CLOUD_MAX_TOKENS_PARAM:-max_tokens}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WORKERS=${API_WORKERS:-4}
      - CLOUD_PRICE_LABEL=${CLOUD_PRICE_LABEL:-Gemini 2.5 Flash-Lite}
      - CLOUD_INPUT_USD_PER_M=${CLOUD_INPUT_USD_PER_M:-0.10}
      - CLOUD_OUTPUT_USD_PER_M=${CLOUD_OUTPUT_USD_PER_M:-0.40}
      - SERVER_PRICE_LABEL=${SERVER_PRICE_LABEL:-AWS m7i.xlarge on-demand, 4 vCPU}
      - SERVER_USD_PER_HOUR=${SERVER_USD_PER_HOUR:-0.2016}
    volumes:
      - model-storage:/models
      - sqlite-data:/data
      - ./backend:/app:ro
      - ./frontend:/app/frontend:ro
    networks: [default, docker-control]
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # CPU affinity hint — adjust to your NUMA topology
    cpuset: "0-3"
    mem_limit: "1g"          # was 12g — see README-DEPLOY.md "Memory"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Docker API proxy ────────────────────────────────────────────────────────
  # The only container that mounts the Docker socket, which is host-root
  # equivalent. api and worker reach it over a private network and can only
  # manage meshpilot-dyn-* containers; see infra/docker-proxy/proxy.py.
  docker-proxy:
    build:
      context: ./infra/docker-proxy
      dockerfile: Dockerfile
    container_name: meshpilot-docker-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [docker-control]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: "64m"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:2375/_health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  # The standing `llamacpp` service that used to run here is retired.
  # llama-server is single-model-per-process, so a single fixed service can
  # only ever serve one GGUF at a time — the reason two models could both
  # show status=READY while only one was truly loaded. Multi-model serving
  # now works by starting one meshpilot-llamacpp *container instance* per
  # resident model on demand, via core/model_orchestrator.py (see api's and
  # worker's docker.sock mounts). This stanza keeps the `build:` context
  # alive so `docker compose build llamacpp` still produces the
  # meshpilot-llamacpp image the orchestrator creates instances from — the
  # `build-only` profile means plain `docker compose up`/`build` (no
  # profile) never starts or builds it as a standing service.
  llamacpp:
    build:
      context: ./infra/llamacpp
      dockerfile: Dockerfile
    profiles: ["build-only"]

  # ── ONNX Runtime Server ─────────────────────────────────────────────────────
  onnx:
    build:
      context: ./infra/onnx
      dockerfile: Dockerfile
    container_name: meshpilot-onnx
    environment:
      - ONNX_MODEL_DIR=/models
      - ONNX_HOST=0.0.0.0
      - ONNX_PORT=8090
      - ORT_NUM_THREADS=${ORT_NUM_THREADS:-4}
      - ORT_INTER_OP_THREADS=${ORT_INTER_OP_THREADS:-2}
    volumes:
      - model-storage:/models:ro
    restart: unless-stopped
    logging: *default-logging
    cpuset: "0-3"
    mem_limit: "1g"          # was 10g

  # ── PyTorch Baseline ("without MeshPilot") ─────────────────────────────────
  # Plain transformers/PyTorch CPU inference, no quantization, no llama.cpp.
  # Exists so the dashboard's Compare view can show a genuinely live
  # "without MeshPilot" response instead of a canned number. Pinned to a
  # separate cpuset from the api/onnx/worker group (0-3) and from dynamic
  # llama.cpp instances (8-11, see core/model_orchestrator.py) so neither
  # side of the comparison contends for the same cores.
  pytorch-baseline:
    build:
      context: ./infra/pytorch-baseline
      dockerfile: Dockerfile
    container_name: meshpilot-pytorch-baseline
    environment:
      - BASELINE_MODEL_DIR=/baseline_model
      - BASELINE_THREADS=4
    volumes:
      - ./baseline-models/qwen2.5-0.5b-instruct-fp32:/baseline_model:ro
    restart: unless-stopped
    logging: *default-logging
    cpuset: "4-7"
    mem_limit: "3g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ── PostgreSQL (primary datastore) ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: meshpilot-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-meshpilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-meshpilot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meshpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (task queue + caching) ────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: meshpilot-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Celery Worker (async inference + quantization jobs) ─────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meshpilot-worker
    command: celery -A core.celery_app worker --loglevel=info --concurrency=2 -Q inference,quantize
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - REDIS_URL=redis://redis:6379/0
      - MODEL_STORAGE=/models
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY:?Set AUDIT_HMAC_KEY in .env}
      - DOCKER_PROXY_URL=http://docker-proxy:2375
      - CLOUD_PRICE_LABEL=${CLOUD_PRICE_LABEL:-Gemini 2.5 Flash-Lite}
      - CLOUD_INPUT_USD_PER_M=${CLOUD_INPUT_USD_PER_M:-0.10}
      - CLOUD_OUTPUT_USD_PER_M=${CLOUD_OUTPUT_USD_PER_M:-0.40}
      - SERVER_PRICE_LABEL=${SERVER_PRICE_LABEL:-AWS m7i.xlarge on-demand, 4 vCPU}
      - SERVER_USD_PER_HOUR=${SERVER_USD_PER_HOUR:-0.2016}
      - ONNX_URL=http://onnx:8090
    volumes:
      - model-storage:/models
      - sqlite-data:/data
      - ./backend:/app:ro
    # Async inference and fit reports also start llama.cpp containers.
    networks: [default, docker-control]
    depends_on:
      redis:
        condition: service_started
      onnx:
        condition: service_started
      postgres:
        condition: service_healthy
      # worker's `command:` override skips the Dockerfile's CMD (and so
      # never runs `alembic upgrade head` itself) — wait for api's healthy
      # state instead, since api only starts serving /health after its own
      # migration step completes. Prevents the worker racing ahead of api
      # and querying tables that don't exist yet on a fresh Postgres.
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    cpuset: "0-3"
    mem_limit: "768m"       # was 8g

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: meshpilot-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    logging: *default-logging

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: meshpilot-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging

networks:
  docker-control:
    internal: true

volumes:
  model-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODEL_DIR:-/opt/meshpilot/models}   # must exist — deploy.sh creates it
  sqlite-data:   # retained temporarily as a rollback reference after the Postgres migration — see backups/
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  nginx-logs:
