# Shared by the HTTP and HTTPS servers in nginx.conf.

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;

# OpenAI-compatible API. Buffering is off so streamed tokens arrive as generated.
location /v1/ {
    proxy_pass         http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_buffering    off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 10m;
}

# API
location /api/ {
    proxy_pass         http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

# Prometheus scrapes api:8000 directly; nothing outside needs this.
location /metrics {
    return 403;
}

# Grafana
location /grafana/ {
    proxy_pass         http://grafana_backend/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Frontend (static files served by FastAPI)
location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    proxy_pass         http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   Connection        "";
}

# Health check
location /health {
    proxy_pass http://api_backend/health;
    access_log off;
}
