worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 8192m;   # 8GB for model uploads
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Docker's DNS. Containers can change address when they restart, so nginx
    # keeps looking them up instead of only once at startup.
    resolver 127.0.0.11 valid=5s;

    upstream api_backend {
        zone api_backend 64k;
        server api:8000 resolve;
        keepalive 32;
    }

    upstream grafana_backend {
        zone grafana_backend 64k;
        server grafana:3000 resolve;
    }

    # Published on loopback only, for this machine and a reverse proxy on it.
    server {
        listen 80;
        server_name _;
        include /etc/nginx/meshpilot-locations.conf;
    }

    # What employees connect to. No HSTS here: with the default self-signed
    # certificate it would stop people clicking through the browser warning.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;

        include /etc/nginx/meshpilot-locations.conf;
    }
}
