global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'meshpilot'

scrape_configs:
  - job_name: 'meshpilot-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  # No static 'meshpilot-llamacpp' target: llama.cpp instances are now
  # created/destroyed dynamically per model (core/model_orchestrator.py),
  # each under its own container name -- there's no single fixed address for
  # Prometheus's static_configs to scrape anymore, and no service discovery
  # for the dynamic instances has been added (out of scope for now).

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
